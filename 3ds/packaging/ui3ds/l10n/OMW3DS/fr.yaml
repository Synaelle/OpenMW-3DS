# The starting tutorial's messages, worded for the 3DS from the French edition's own.
TutorialMenus: "Touchez les onglets de l'écran tactile pour utiliser vos menus. Quand vous en avez terminé, touchez de nouveau le même onglet pour les fermer."
TutorialPapers: "Lisez vos papiers en appuyant sur A quand vous les regardez. Puis choisissez 'Prendre' pour vous en saisir."
TutorialHatch: "Regardez la porte et appuyez sur A pour l'ouvrir. A active les objets et les gens que vous regardez."
TutorialCaptain: "Appuyez sur A pour parler au capitaine. Choisissez les sujets de conversation. N'essayez pas la persuasion sur lui. En cas d'échec, il n'éprouverait qu'antipathie pour vous."
TutorialJournal: "Appuyez sur Haut sur la croix directionnelle pour utiliser votre journal et consulter ce qui vous a été dit. Rendez-vous à l'auberge d'Arrile sur votre gauche. À vous de jouer maintenant. Bonne chance."
TutorialDagger: "Apprenez à combattre. Prenez la dague sur la table en l'activant avec A."
TutorialMove: "Le pad circulaire vous déplace, et le stick C permet de regarder autour de vous."
