# The starting tutorial's messages, worded for the 3DS from the German edition's own.
TutorialMenus: "Tippt auf die Reiter auf dem Touchscreen, um Eure Menüs zu öffnen. Tippt erneut auf denselben Reiter, um sie wieder zu schließen."
TutorialPapers: "Mit A könnt Ihr Eure Papiere lesen, wenn Ihr sie anseht. Wählt dann 'Nehmen', um sie aufzunehmen."
TutorialHatch: "Richtet den Blick auf die Luke und drückt A, um sie zu öffnen. Mit A können Objekte benutzt und Personen angesprochen werden."
TutorialCaptain: "Drückt A, um mit dem Hauptmann zu reden. Wählt Stichworte, nach denen Ihr fragen wollt. Versucht nicht, ihn zu überzeugen. Wenn Ihr nicht gut darin seid, sinkt sein Wohlwollen Euch gegenüber."
TutorialJournal: "Drückt oben auf dem Steuerkreuz, um Euer Journal aufzurufen und nachzulesen, was man Euch gesagt hat. Ihr solltet vermutlich zuerst Arrilles Handelshaus zu Eurer Linken aufsuchen. Ihr seid jetzt auf Euch selbst gestellt. Viel Glück."
TutorialDagger: "Ihr solltet lernen, wie man kämpft. Nehmt den Dolch, indem Ihr A drückt."
TutorialMove: "Mit dem Schiebepad bewegt Ihr Euch, mit dem C-Stick seht Ihr Euch um."
