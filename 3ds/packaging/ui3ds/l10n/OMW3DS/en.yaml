# The starting tutorial's messages, worded for the 3DS (components/interpreter/miscopcodes.hpp).
TutorialMenus: "Tap the tabs on the touch screen to use your menus. When you are done with them, tap the same tab again to close them."
TutorialPapers: "Read your papers by pressing A while looking at them. Then select 'Take' to pick them up."
TutorialHatch: "Look up at the hatch and press A to open it. A activates objects and people you are looking at."
TutorialCaptain: "Press A to talk to the Captain. Select topics to ask about them. Don't try persuasion on him. If you're not good at it, he will start to dislike you."
TutorialJournal: "Press Up on the D-pad to use your journal and review what you've been told. You should probably check out Arrille's Tradehouse up on the left. You're on your own now. Good luck."
TutorialDagger: "You should learn how to do combat. Pick up the dagger on the table by activating it with A."
TutorialMove: "The Circle Pad moves you, and the C-Stick looks around."
