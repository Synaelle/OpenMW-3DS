# OpenMW 3DS settings (installed as sdmc:/openmw/config/settings.cfg by scripts/stage-sd.ps1).
# Only values that differ from openmw's settings-default.cfg. See LIMITATIONS.md section 6.

[Camera]
viewing distance = 2560
reverse z = false
small feature culling = true

[Cells]
preload enabled = false
preload num threads = 1

[Physics]
# One physics worker: on the 3DS std::threads run on core 2 (platform3ds), so physics overlaps the main
# thread's cull/draw. Set back to 0 if actor movement misbehaves.
async num threads = 1

[Lua]
# Lua on the main thread. With a worker thread (1), its background GC loop never blocks, and the 3DS doesn't
# time-slice threads on one core: it starved core 2 (physics) and the game hung after two frames in Azahar.
lua num threads = 0
memory limit = 12582912
# Forced GC work per frame (upstream 100, ~3 ms on hardware). 20: ~0.8 ms, Lua heap 4.3-6.0 MB instead of
# <= 5.3 MB in Arrille's (0 = Lua's own GC only: up to 9.3 MB).
gc steps per frame = 20

[Navigator]
enable = false

[Terrain]
distant terrain = false
object paging = false

[Shadows]
enable shadows = false

[Water]
shader = false
refraction = false

[Groundcover]
enabled = false

[Post Processing]
enabled = false

[Game]
# 3584 is the minimum OpenMW accepts
actors processing range = 3584

[Map]
# The global map keeps RGB + alpha + RGBA overlay images of (cells x cell size)^2: 18 px/cell is ~5 MB
# for Vvardenfell, 8 px/cell ~1 MB (the 400x240 screen can't show more detail anyway).
global map cell size = 8
local map resolution = 128
local map widget size = 256

[Sound]
buffer cache min = 4
buffer cache max = 8

[Video]
resolution x = 400
resolution y = 240
# 2 = windowed. 0 (fullscreen) makes the settings window "correct" 400x240 to a fullscreen mode SDL's
# dummy driver reports (1024x768), and that got saved to settings.cfg at exit.
window mode = 2
framerate limit = 30
