# OpenMW 3DS settings (installed as sdmc:/openmw/config/settings.cfg by scripts/stage-sd.ps1).
# Only values that differ from openmw's settings-default.cfg. See LIMITATIONS.md section 6.

[Camera]
viewing distance = 2560
reverse z = false
small feature culling = true

[Cells]
preload enabled = false
preload num threads = 1

[Physics]
async num threads = 0

[Lua]
lua num threads = 0
memory limit = 12582912

[Navigator]
enable = false

[Terrain]
distant terrain = false
object paging = false

[Shadows]
enable shadows = false

[Water]
shader = false
refraction = false

[Groundcover]
enabled = false

[Post Processing]
enabled = false

[Game]
# 3584 is the minimum OpenMW accepts
actors processing range = 3584

[Map]
# The global map keeps RGB + alpha + RGBA overlay images of (cells x cell size)^2: 18 px/cell is ~5 MB
# for Vvardenfell, 8 px/cell ~1 MB (the 400x240 screen can't show more detail anyway).
global map cell size = 8
local map resolution = 128
local map widget size = 256

[Sound]
buffer cache min = 4
buffer cache max = 8

[Video]
resolution x = 400
resolution y = 240
window mode = 0
framerate limit = 30
